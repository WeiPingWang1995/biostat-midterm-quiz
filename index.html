<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生統期中考測驗</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
/* 顏色變數：淺色預設，深色由系統或手動切換 */
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--muted:#656d76;--line:#e3e1da;--accent:#2f6f5e;--accent-soft:#e3efe9;--ok:#1a7f37;--ok-soft:#dafbe1;--bad:#cf222e;--bad-soft:#ffebe9;--warn-soft:#fff8c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1e2227;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#6fc2a6;--accent-soft:#1f3a32;--ok:#3fb950;--ok-soft:#12301b;--bad:#f85149;--bad-soft:#3b1618;--warn-soft:#3a3212}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1e2227;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#6fc2a6;--accent-soft:#1f3a32;--ok:#3fb950;--ok-soft:#12301b;--bad:#f85149;--bad-soft:#3b1618;--warn-soft:#3a3212}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:860px;margin:0 auto;padding:12px 16px 6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;flex:1 1 100%;min-width:0}
html,body{overflow-x:hidden}
main *{max-width:100%}
.stat{font-size:13px;color:var(--muted)}
.tabs{max-width:860px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tabs small{opacity:.75;margin-left:4px}
main{max-width:860px;margin:0 auto;padding:16px}
.intro{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.card.right{border-left:5px solid var(--ok)}.card.wrong{border-left:5px solid var(--bad)}
.card h2{font-size:16px;margin:0 0 8px;line-height:1.5}
.qid{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 7px;margin-right:6px;font-size:13px}
.card p{margin:6px 0}
table{border-collapse:collapse;margin:8px 0;font-size:14px;display:block;overflow-x:auto;max-width:100%}
td,th{border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
tr:first-child td{background:var(--accent-soft);font-weight:600}
blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.fig{max-width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;margin:6px 0}
textarea{width:100%;min-height:64px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.ok.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.check{font-size:14px;padding:6px 10px;border-radius:8px;margin-top:8px}
.check.good{background:var(--ok-soft)}.check.part{background:var(--warn-soft)}
.ans{margin-top:10px;padding:10px 12px;background:var(--accent-soft);border-radius:8px}
.ans .lab{font-weight:600;color:var(--accent);margin-bottom:4px}
details.notes{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 16px;margin-bottom:14px}
details.notes summary{cursor:pointer;font-weight:600}
.note h3{font-size:15px;margin:12px 0 4px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:520px){body{font-size:15px}.card{padding:14px}.row .sp{display:none}.btn{padding:6px 10px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📝 生統期中考測驗（CH01–CH05）</h1>
    <span class="stat" id="stat"></span>
    <button class="btn" id="theme" title="切換深淺色">🌓</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<script>
const DATA = [{"key": "CH01", "title": "Chapter 1　生物統計導論（HW1 申論＋講義）", "notes": [{"title": "", "html": "<blockquote>HW1 是讀兩篇文章後的申論題（開放式，無標準答案），期中考若出現多半是短答。以下給「答題要點」。</blockquote>"}], "qs": [{"id": "1-1", "title": "1-1　統計方法與 AI 在醫療決策中是互補還是取代？（HW1 Q1）", "q": "<p><i>Do you think \"statistical methods\" and \"AI technologies\" will play complementary or substitutive roles in future medical decision-making?</i></p>", "a": "<ul>\n<li>立場：<b>互補</b>。AI／大數據的訓練與驗證本身建立在統計原則上（抽樣、偏差、不確定性量化）。</li>\n<li>統計負責「研究設計、因果推論、不確定性」；AI 負責「大量資料中找模式、預測」。</li>\n<li>AI 若沒有統計素養把關，容易把相關當因果、忽略選樣偏差（訓練資料不具代表性）。</li>\n</ul>", "label": "👉 答題要點", "keys": [], "hasImg": false}, {"id": "1-2", "title": "1-2　科學證據在公共政策中應佔多大比重？有沒有證據很強但政策難推動的例子？（HW1 Q2）", "q": "", "a": "<ul>\n<li>證據應是政策的<b>主要基礎</b>，但政策還要考量經濟、文化、產業利益與可行性。</li>\n<li>例子：含糖飲料稅、加工食品／食品添加物管制、菸害防制——證據強，但受產業遊說與民眾接受度影響而推動困難。</li>\n</ul>", "label": "👉 答題要點", "keys": [], "hasImg": false}, {"id": "1-3", "title": "1-3　如何加強自己的統計與數據素養？（HW1 Q3）", "q": "", "a": "<ul>\n<li>系統性修習生統課程，並在自己研究中實作（例：測力裝置資料的研究設計、樣本數、重複測量的分析單位）。</li>\n<li>學會正確解讀 P 值、信賴區間，分辨相關與因果；搭配程式工具（Python／R）與跨領域合作。</li>\n</ul>", "label": "👉 答題要點", "keys": [], "hasImg": false}, {"id": "1-4", "title": "1-4　科學家與監管機構如何避免數據詮釋傷害社會？（HW1 Q4，OxyContin 例）", "q": "", "a": "<ul>\n<li>預先登錄研究計畫與主要結果、透明報告、獨立審查與利益衝突揭露。</li>\n<li>避免誤用 P 值、混淆相關與因果；上市後持續監測（Phase IV）。</li>\n</ul>", "label": "👉 答題要點", "keys": [], "hasImg": false}, {"id": "1-5", "title": "1-5　「提升統計素養」與「加速監管創新」哪個更迫切？（HW1 Q5）", "q": "", "a": "<p>開放題，重點是<b>有立場＋有例子</b>。常見論點：統計素養是基礎——監管創新（AI 審查、Big Data）若缺乏懂統計的人把關，只會更快做出錯誤決定。</p>", "label": "👉 答題要點", "keys": [], "hasImg": false}, {"id": "1-6", "title": "1-6　（講義 P10–13）用一句話說出生物統計的流程", "q": "", "a": "<p>定義問題 → 確定母體 → 收集適當資料（抽樣、設計）→ 量化結果或關聯 → 評估不確定性 → 在研究限制內解讀結果。橫斷性研究能估計某時間點的疾病程度，但推廣到其他時間或母體要謹慎。</p>", "label": "👉 答案", "keys": [], "hasImg": false}]}, {"key": "CH02", "title": "Chapter 2　研究設計（HW2 15 題＋講義練習）", "notes": [{"title": "", "html": ""}, {"title": "判斷口訣", "html": "<table>\n<tr>\n<td>設計</td>\n<td>關鍵特徵</td>\n<td>方向</td>\n</tr>\n<tr>\n<td>病例報告／病例系列</td>\n<td>沒有對照組</td>\n<td>描述</td>\n</tr>\n<tr>\n<td>橫斷性 Cross-sectional</td>\n<td>同一時間點量暴露與結果</td>\n<td>快照</td>\n</tr>\n<tr>\n<td>世代 Cohort</td>\n<td>從<b>暴露</b>分組，向前追蹤</td>\n<td>暴露 → 結果</td>\n</tr>\n<tr>\n<td>病例對照 Case-control</td>\n<td>從<b>結果</b>分組，回溯暴露</td>\n<td>結果 → 過去暴露</td>\n</tr>\n<tr>\n<td>RCT</td>\n<td>研究者<b>隨機指派</b>介入</td>\n<td>實驗</td>\n</tr>\n<tr>\n<td>交叉試驗 Crossover</td>\n<td>每人依隨機順序接受兩種處理</td>\n<td>自己當對照</td>\n</tr>\n</table>"}], "qs": [{"id": "2-1", "title": "2-1　Opening Challenge（講義 P3）", "q": "<p>研究發現規律運動者心血管疾病風險低 30%，能否推論運動<b>導致</b>風險降低？(A) YES (B) NO (C) Not enough information</p>", "a": "<p><b>(C) 資訊不足。</b>要先知道研究設計：若是觀察性研究只能說「關聯」，可能有混淆因子（運動者可能也較少吸菸、飲食較好）。需要 RCT 才能支持較強的因果推論。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-2", "title": "2-2　Why Randomization（講義 P27）", "q": "<p>新藥 A 讓 80% 病人改善，藥有效嗎？</p>", "a": "<p><b>資訊不足。</b>要問：誰接受治療？有沒有對照組？兩組可比嗎？沒有對照組就不知道不吃藥會不會也有 80% 自然改善。隨機化能平衡已知與未知的預後因子（但只是<b>減少</b>混淆，不保證完美平衡）。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-3", "title": "2-3　Study Design Decision Challenge（講義 P37，也是作業題）", "q": "<ul>\n<li>Case 1：今天調查 2000 名成人的運動習慣與下背痛現況</li>\n<li>Case 2：納入有／無高血壓者，追蹤 10 年看心血管疾病發生</li>\n<li>Case 3：選取肺癌病人與對照組，比較過去吸菸史</li>\n<li>Case 4：隨機分配病人接受新藥或標準治療</li>\n</ul>", "a": "<ol>\n<li><b>橫斷性研究</b>——單一時間點，只能說關聯，無法判斷先後</li>\n<li><b>世代研究</b>——從暴露出發向前追蹤，可算發生率、RR</li>\n<li><b>病例對照研究</b>——從結果出發回溯，只能算 OR，有回憶偏差風險</li>\n<li><b>RCT</b>——研究者隨機指派，可支持較強因果推論</li>\n</ol>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-4", "title": "2-4　隨機化 vs. 盲性各在解決什麼？（講義 P29–30）", "q": "", "a": "<p><b>隨機化減少混淆（confounding）</b>；<b>盲性減少偏差（bias）</b>。雙盲＝參與者與結果評估者都不知分組。手術類試驗無法讓醫師盲，至少要讓結果評估者盲。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-5", "title": "2-5　臨床試驗四期（講義 P33）", "q": "", "a": "<p>Phase I：少量健康志願者，<b>安全性</b>、劑量 → Phase II：少量病人，安全＋<b>初步療效</b>、找劑量 → Phase III：大量病人，<b>確認療效</b>（多中心 RCT）→ Phase IV：<b>上市後監測</b>長期與罕見不良反應。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-6", "title": "2-6　HW2 Q1：胰臟癌與吸菸（50 病例、100 對照，查病歷吸菸史）——什麼設計？優缺點？", "q": "", "a": "<p><b>病例對照研究</b>（結果 → 過去暴露）。優點：適合罕見疾病、快速便宜、可同時看多個暴露。缺點：病歷吸菸紀錄不完整（資訊偏差）、對照組選取可能有選擇偏差、混淆難排除、無法算發生率。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-7", "title": "2-7　HW2 Q2：上題最可能的偏差來源？", "q": "", "a": "<p><b>資訊偏差中的分類錯誤（misclassification）</b>：病歷對吸菸史記錄不完整；若病例組被問得更仔細，會變成<b>差別性分類錯誤</b>，扭曲關聯。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-8", "title": "2-8　HW2 Q3：早產兒用藥 50 人 vs. 未用藥 50 人，2 歲測發展——什麼設計？", "q": "", "a": "<p><b>前瞻性世代研究</b>（暴露 → 結果）。優點：時序清楚、結果用標準化測驗。缺點：藥物非隨機分派 → <b>適應症干擾</b>（病情重的才用藥）、失訪、樣本數可能不足。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-9", "title": "2-9　HW2 Q4：上題中偏差還是混淆比較嚴重？各舉一例", "q": "", "a": "<p><b>混淆較嚴重</b>（非隨機分派）。混淆例：早產嚴重度（出生週數、體重）同時影響用藥與發展。偏差例：評估者知道誰有用藥 → 觀察者／偵測偏差。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-10", "title": "2-10　HW2 Q5：膽囊手術，100 人隨機分派新手術 vs. 標準手術，比恢復天數", "q": "", "a": "<p><b>RCT</b>。優點：隨機化平衡干擾因子、因果推論強、結果客觀。缺點：手術難以雙盲（醫師一定知道）、樣本數可能不足、外推性受限。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-11", "title": "2-11　HW2 Q6：70 人調查咖啡因攝取＋抽血驗血糖", "q": "", "a": "<p><b>橫斷性研究</b>。優點：快、便宜、可估盛行率。缺點：無法確定時序（反向因果：血糖異常者可能改變喝咖啡習慣）、無法算發生率、混淆未控制。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-12", "title": "2-12　HW2 Q7：上題能設計成 RCT 嗎？", "q": "", "a": "<p><b>實務上困難</b>：長期控制咖啡因攝取遵從度差、難以遮盲（味道與提神效果）、葡萄糖耐受變化需長期追蹤、若咖啡因可能有害則有倫理疑慮。若勉強設計：隨機分派固定咖啡因劑量 vs. 去咖啡因飲品，固定期間後比較葡萄糖耐受測驗。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-13", "title": "2-13　HW2 Q8：20 名肥胖者依隨機順序先後執行兩種減重計畫", "q": "", "a": "<p><b>交叉試驗（crossover）</b>。優點：每人當自己的對照、所需樣本少。缺點：<b>延續效應（carryover）</b>、減重難以回到原點、需清洗期、研究時間長。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-14", "title": "2-14　HW2 Q9：骨科醫師蒐集 4 名膝關節置換病人的童年運動史並發表", "q": "", "a": "<p><b>病例系列（case series）</b>。優點：便宜快速、可提出假說。缺點：<b>沒有對照組</b>、無法建立因果、樣本極小、選樣偏差。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-15", "title": "2-15　HW2 Q10：替上題假說建議替代設計，主要難題是什麼？", "q": "", "a": "<p><b>病例對照研究</b>（膝關節置換病人 vs. 對照，回溯童年運動）或<b>世代研究</b>（兒童依運動分組追蹤數十年）。難題：潛伏期數十年——世代研究不切實際；病例對照有<b>回憶偏差</b>，且體重、職業、受傷史等混淆難排除。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-16", "title": "2-16　HW2 Q11：1940 年工廠 2000 名女性，生產線 vs. 行政各 1000 人，追蹤到 1970 年骨癌（30 vs. 9）", "q": "", "a": "<p><b>(C) 世代研究</b>——依暴露（工作場所）分組向前追蹤；非隨機分派所以不是 RCT。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-17", "title": "2-17　HW2 Q12：病歷找出 40 名氣喘童與 40 名同齡無氣喘童，訪談二手菸暴露", "q": "", "a": "<p><b>(B) 病例對照研究</b>——依結果（氣喘）分組，回溯暴露。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-18", "title": "2-18　HW2 Q13：160 名學生隨機分派綜合維他命或安慰劑 20 天，比較考試分數", "q": "", "a": "<p><b>(A) RCT</b>——研究者隨機指派介入。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-19", "title": "2-19　HW2 Q14：50 名發展遲緩童與 50 名正常童，問家長嬰兒期二手菸暴露", "q": "", "a": "<p><b>(C) 病例對照研究</b>——起點是結果（發展遲緩），不是暴露，所以不是任何一種世代研究。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "2-20", "title": "2-20　HW2 Q15：35–70 歲世代追蹤 20 年，評估新發炎指標與猝死——最適合的設計與優缺點", "q": "", "a": "<p><b>前瞻性世代研究</b>。優點：指標在發病前測量 → 時序清楚、可算發生率與 RR、可同時看多個暴露與結果。缺點：猝死罕見需大樣本、追蹤 20 年成本高且易失訪、仍有混淆（年齡、吸菸等）需校正。</p>", "label": "👉 答案", "keys": [], "hasImg": false}]}, {"key": "CH03", "title": "Chapter 3　量化疾病頻率與關聯（HW3 13 題＋講義練習）", "notes": [{"title": "", "html": ""}, {"title": "公式小抄", "html": "<table>\n<tr>\n<td>指標</td>\n<td>公式</td>\n<td>分母</td>\n</tr>\n<tr>\n<td>盛行率 Prevalence</td>\n<td>現有病例 ÷ 全部人</td>\n<td>全部人（含新舊病例）</td>\n</tr>\n<tr>\n<td>累積發生率 CI</td>\n<td>新病例 ÷ 起點無病有風險的人</td>\n<td>起點沒病的人</td>\n</tr>\n<tr>\n<td>發生率 IR</td>\n<td>新病例 ÷ 總風險人時</td>\n<td>人年／人月</td>\n</tr>\n<tr>\n<td>風險差 RD</td>\n<td><span class=\"tex\">\\(CI_1-CI_0\\)</span></td>\n<td>—</td>\n</tr>\n<tr>\n<td>相對危險 RR</td>\n<td><span class=\"tex\">\\(CI_1/CI_0\\)</span></td>\n<td>只用於世代／試驗</td>\n</tr>\n<tr>\n<td>勝算 Odds</td>\n<td>有事件 ÷ 沒事件</td>\n<td>沒事件的人</td>\n</tr>\n<tr>\n<td>勝算比 OR</td>\n<td><span class=\"tex\">\\((a×d)/(b×c)\\)</span></td>\n<td>病例對照只能用它</td>\n</tr>\n<tr>\n<td>PAR</td>\n<td>整體 CI − 未暴露組 CI</td>\n<td>PAR% = PAR ÷ 整體 CI</td>\n</tr>\n</table>"}], "qs": [{"id": "3-1", "title": "3-1　講義 Practice problem（P35）", "q": "<p>題 1（世代研究）：A 組 18/120 發病、B 組 9/120 發病，求 RR。題 2（病例對照）：病例 45 吸菸／15 不吸菸，對照 30 吸菸／30 不吸菸，求 OR。</p>", "a": "<p>題 1：<span class=\"tex\">\\(RR=(18/120)/(9/120)=0.15/0.075=\\)</span> <b>2.00</b><br>題 2：<span class=\"tex\">\\(OR=(45×30)/(30×15)=1350/450=\\)</span> <b>3.00</b></p>", "label": "👉 答案", "keys": [{"v": 2.0, "pct": false, "label": "2.00"}, {"v": 3.0, "pct": false, "label": "3.00"}], "hasImg": false}, {"id": "3-2", "title": "3-2　講義範例：RR vs. OR（P31–32）", "q": "<p>暴露組 20/100 發病、對照組 10/100 發病，分別求 RR 與 OR，並說明為何不同。</p>", "a": "<p><span class=\"tex\">\\(RR=0.20/0.10=\\)</span> <b>2.00</b>；<span class=\"tex\">\\(OR=(20/80)/(10/90)=\\)</span> <b>2.25</b>。結果不罕見（10–20%）時 OR 會比 RR 更偏離 1，不能把 OR=2.25 說成「2.25 倍風險」。只有結果罕見時 OR ≈ RR。</p>", "label": "👉 答案", "keys": [{"v": 2.0, "pct": false, "label": "2.00"}, {"v": 2.25, "pct": false, "label": "2.25"}], "hasImg": false}, {"id": "3-3", "title": "3-3　講義範例：吸菸與癌症病例對照（P33–34）", "q": "<p>癌症病例 50（40 吸菸／10 不吸）、對照 50（29 吸菸／21 不吸），求 OR。橫著算和直著算會一樣嗎？</p>", "a": "<p><span class=\"tex\">\\(OR=(40×21)/(29×10)=840/290≈\\)</span> <b>2.90</b>。橫算 <span class=\"tex\">\\((40/29)/(10/21)\\)</span> 與直算 <span class=\"tex\">\\((40/10)/(29/21)\\)</span> 都是 2.90，因為兩者都等於交叉乘積 <span class=\"tex\">\\(ad/bc\\)</span>。</p>", "label": "👉 答案", "keys": [{"v": 2.9, "pct": false, "label": "2.90"}], "hasImg": false}, {"id": "3-4", "title": "3-4　講義範例：人時計算（P11–14）", "q": "<p>6 人追蹤 10 年，貢獻人年 6, 9, 10, 2, 7, 5，共 3 例 CVD。求發生率；為何不能直接用 3/6？</p>", "a": "<p>總人年 <span class=\"tex\">\\(=6+9+10+2+7+5=39\\)</span>；<span class=\"tex\">\\(IR=3/39≈0.0769\\)</span>／人年＝<b>7.69／100 人年</b>。不能用 3/6 是因為有人中途死亡、退出，觀察時間不同，人數當分母會錯估。⚠️「7.69／100 人年」是<b>率</b>，不能說成 7.69% 機率。</p>", "label": "👉 答案", "keys": [{"v": 7.69, "pct": false, "label": "7.69"}, {"v": 100.0, "pct": false, "label": "100"}], "hasImg": false}, {"id": "3-5", "title": "3-5　HW3 Q1：1250 人基準點與 2 年後的高血壓狀態", "q": "<table>\n<tr>\n<td></td>\n<td>2 年後無 HTN</td>\n<td>2 年後有 HTN</td>\n</tr>\n<tr>\n<td>基準點無 HTN</td>\n<td>850</td>\n<td>148</td>\n</tr>\n<tr>\n<td>基準點有 HTN</td>\n<td>45</td>\n<td>207</td>\n</tr>\n</table>\n<p>(a) 基準點盛行率　(b) 2 年後盛行率　(c) 2 年累積發生率</p>", "a": "<p>(a) <span class=\"tex\">\\((45+207)/1250=252/1250=\\)</span> <b>20.16%</b><br>(b) <span class=\"tex\">\\((148+207)/1250=355/1250=\\)</span> <b>28.40%</b><br>(c) 分母只能是基準點無 HTN 的 998 人：<span class=\"tex\">\\(148/998=\\)</span> <b>14.83%</b>（常見錯誤：用 148/850 或 148/1250）</p>", "label": "👉 答案", "keys": [{"v": 20.16, "pct": true, "label": "20.16%"}, {"v": 28.4, "pct": true, "label": "28.40%"}, {"v": 14.83, "pct": true, "label": "14.83%"}], "hasImg": false}, {"id": "3-6", "title": "3-6　HW3 Q2：基準點高血壓 vs. 5 年中風", "q": "<table>\n<tr>\n<td></td>\n<td>無中風</td>\n<td>中風</td>\n</tr>\n<tr>\n<td>無 HTN</td>\n<td>952</td>\n<td>46</td>\n</tr>\n<tr>\n<td>有 HTN</td>\n<td>234</td>\n<td>18</td>\n</tr>\n</table>\n<p>(a) 整體中風 CI　(b) 有 HTN 者 CI　(c) 無 HTN 者 CI　(d) 風險差　(e) RR　(f) PAR</p>", "a": "<p>(a) <span class=\"tex\">\\(64/1250=\\)</span> <b>5.12%</b><br>(b) <span class=\"tex\">\\(18/252=\\)</span> <b>7.14%</b><br>(c) <span class=\"tex\">\\(46/998=\\)</span> <b>4.61%</b><br>(d) <span class=\"tex\">\\(7.14\\%-4.61\\%=\\)</span> <b>2.53 個百分點</b><br>(e) <span class=\"tex\">\\(7.14/4.61≈\\)</span> <b>1.55</b><br>(f) <span class=\"tex\">\\(PAR=5.12\\%-4.61\\%=\\)</span> <b>0.51 個百分點</b>；PAR% <span class=\"tex\">\\(=0.51/5.12≈\\)</span> <b>10%</b>（族群中約一成中風可歸因於高血壓）</p>", "label": "👉 答案", "keys": [{"v": 5.12, "pct": true, "label": "5.12%"}, {"v": 7.14, "pct": true, "label": "7.14%"}, {"v": 4.61, "pct": true, "label": "4.61%"}, {"v": 2.53, "pct": false, "label": "2.53"}, {"v": 1.55, "pct": false, "label": "1.55"}, {"v": 0.51, "pct": false, "label": "0.51"}, {"v": 10.0, "pct": true, "label": "10%"}], "hasImg": false}, {"id": "3-7", "title": "3-7　HW3 Q3：病例對照——懷孕初期大量飲酒與流產", "q": "<table>\n<tr>\n<td></td>\n<td>流產</td>\n<td>足月</td>\n</tr>\n<tr>\n<td>大量飲酒</td>\n<td>14</td>\n<td>4</td>\n</tr>\n<tr>\n<td>無大量飲酒</td>\n<td>36</td>\n<td>46</td>\n</tr>\n</table>\n<p>(a) 大量飲酒者的流產勝算　(b) 無大量飲酒者的流產勝算　(c) OR</p>", "a": "<p>(a) <span class=\"tex\">\\(14/4=\\)</span> <b>3.5</b><br>(b) <span class=\"tex\">\\(36/46≈\\)</span> <b>0.78</b><br>(c) <span class=\"tex\">\\((14×46)/(4×36)=644/144≈\\)</span> <b>4.47</b>。病例對照研究只能算 OR，不能算 RR（病例與對照人數是研究者決定的）。</p>", "label": "👉 答案", "keys": [{"v": 3.5, "pct": false, "label": "3.5"}, {"v": 0.78, "pct": false, "label": "0.78"}, {"v": 4.47, "pct": false, "label": "4.47"}], "hasImg": false}, {"id": "3-8", "title": "3-8　HW3 Q4：降膽固醇新藥 RCT（各 400 人，CAD：新藥 28、安慰劑 42）", "q": "<p>(a) RR　(b) OR　(c) 哪個指標較適合？</p>", "a": "<p>(a) <span class=\"tex\">\\((28/400)/(42/400)=\\)</span> <b>0.67</b>（風險降低約 33%）<br>(b) <span class=\"tex\">\\((28/372)/(42/358)≈\\)</span> <b>0.64</b><br>(c) <b>RR</b>——RCT 屬前瞻追蹤，能直接算風險，RR 解讀較直覺。</p>", "label": "👉 答案", "keys": [{"v": 0.67, "pct": false, "label": "0.67"}, {"v": 0.64, "pct": false, "label": "0.64"}], "hasImg": false}, {"id": "3-9", "title": "3-9　HW3 Q5：接上題，人年：新藥 3451、安慰劑 2984", "q": "<p>(a) 新藥組發生率　(b) 安慰劑組發生率</p>", "a": "<p>(a) <span class=\"tex\">\\(28/3451≈\\)</span> <b>0.00811／人年</b>（8.11／1000 人年）<br>(b) <span class=\"tex\">\\(42/2984≈\\)</span> <b>0.01408／人年</b>（14.08／1000 人年）<br>延伸：IRR <span class=\"tex\">\\(=0.00811/0.01408≈0.58\\)</span></p>", "label": "👉 答案", "keys": [{"v": 0.00811, "pct": false, "label": "0.00811"}, {"v": 0.01408, "pct": false, "label": "0.01408"}], "hasImg": false}, {"id": "3-10", "title": "3-10　HW3 Q6：13 位病人追蹤 24 個月的時間線圖", "q": "<p>(a) 12 個月時癌症盛行率　(b) 12 個月癌症累積發生率　(c) 癌症每月發生率　(d) 死亡每月發生率</p>", "a": "<p>(a) 12 個月時已罹癌 2 人（病人 1、10）：<span class=\"tex\">\\(2/13≈\\)</span> <b>15.4%</b><br>(b) 12 個月內無人退出，新發 2 例：<span class=\"tex\">\\(2/13≈\\)</span> <b>15.4%</b><br>(c) 癌症風險人月（罹癌、死亡、失訪即停）總和 236，6 例：<span class=\"tex\">\\(6/236≈\\)</span> <b>0.0254／人月</b><br>(d) 死亡風險人月（罹癌不停止，只有死亡與失訪停止）<span class=\"tex\">\\(=11×24+18+15=297\\)</span>，1 例：<span class=\"tex\">\\(1/297≈\\)</span> <b>0.0034／人月</b><br>重點觀念：<b>不同結果的「風險人時」停止點不同</b>——算癌症時罹癌就停，算死亡時罹癌者仍持續累計。</p>", "label": "👉 答案（⚠️ 事件月份由圖估讀，±0.5–1 個月）", "keys": [{"v": 15.4, "pct": true, "label": "15.4%"}, {"v": 15.4, "pct": true, "label": "15.4%"}, {"v": 0.0254, "pct": false, "label": "0.0254"}, {"v": 0.0034, "pct": false, "label": "0.0034"}], "hasImg": false}, {"id": "3-11", "title": "3-11　HW3 Q7：500 人 10 年世代，基準點 50 人有 CVD，追蹤中新發 40 人", "q": "<p>(a) 10 年 CI　(b) 基準點盛行率　(c) 10 年時盛行率</p>", "a": "<p>(a) <span class=\"tex\">\\(40/(500-50)=40/450=\\)</span> <b>8.89%</b><br>(b) <span class=\"tex\">\\(50/500=\\)</span> <b>10%</b><br>(c) 假設無人死亡退出：<span class=\"tex\">\\((50+40)/500=\\)</span> <b>18%</b></p>", "label": "👉 答案", "keys": [{"v": 8.89, "pct": true, "label": "8.89%"}, {"v": 10.0, "pct": true, "label": "10%"}, {"v": 18.0, "pct": true, "label": "18%"}], "hasImg": false}, {"id": "3-12", "title": "3-12　HW3 Q8–9：150 人，基準點 24 人 HTN，1 年後新增 12，2 年後再新增 8", "q": "<p>Q8：2 年時盛行率？Q9：2 年累積發生率？</p>", "a": "<p>Q8：<span class=\"tex\">\\((24+12+8)/150=44/150=\\)</span> <b>29.33%</b><br>Q9：<span class=\"tex\">\\((12+8)/(150-24)=20/126=\\)</span> <b>15.87%</b>（分母扣掉基準點已有 HTN 的 24 人）</p>", "label": "👉 答案", "keys": [{"v": 29.33, "pct": true, "label": "29.33%"}, {"v": 15.87, "pct": true, "label": "15.87%"}], "hasImg": false}, {"id": "3-13", "title": "3-13　HW3 Q10：75 歲以上（單位：百萬人）", "q": "<table>\n<tr>\n<td></td>\n<td>中風</td>\n<td>無中風</td>\n</tr>\n<tr>\n<td>有 HTN</td>\n<td>12</td>\n<td>37</td>\n</tr>\n<tr>\n<td>無 HTN</td>\n<td>4</td>\n<td>26</td>\n</tr>\n</table>\n<p>(a) 整體 CI　(b) RR　(c) OR</p>", "a": "<p>(a) <span class=\"tex\">\\(16/79≈\\)</span> <b>20.25%</b><br>(b) <span class=\"tex\">\\((12/49)/(4/30)≈\\)</span> <b>1.84</b><br>(c) <span class=\"tex\">\\((12×26)/(37×4)=312/148≈\\)</span> <b>2.11</b>（結果不罕見，OR 明顯大於 RR）</p>", "label": "👉 答案", "keys": [{"v": 20.25, "pct": true, "label": "20.25%"}, {"v": 1.84, "pct": false, "label": "1.84"}, {"v": 2.11, "pct": false, "label": "2.11"}], "hasImg": false}, {"id": "3-14", "title": "3-14　HW3 Q11：養護機構 625 人，2005 年 48 人糖尿病，2010 年原本沒病者中 57 人罹病", "q": "<p>(a) 2005 盛行率　(b) 5 年 CI　(c) 2010 盛行率（假設無人死亡離開）</p>", "a": "<p>(a) <span class=\"tex\">\\(48/625=\\)</span> <b>7.68%</b><br>(b) <span class=\"tex\">\\(57/(625-48)=57/577=\\)</span> <b>9.88%</b><br>(c) <span class=\"tex\">\\((48+57)/625=105/625=\\)</span> <b>16.8%</b></p>", "label": "👉 答案", "keys": [{"v": 7.68, "pct": true, "label": "7.68%"}, {"v": 9.88, "pct": true, "label": "9.88%"}, {"v": 16.8, "pct": true, "label": "16.8%"}], "hasImg": false}, {"id": "3-15", "title": "3-15　HW3 Q12：55 歲以上中風", "q": "<table>\n<tr>\n<td></td>\n<td>中風</td>\n<td>風險人年</td>\n</tr>\n<tr>\n<td>男（n=125）</td>\n<td>9</td>\n<td>478</td>\n</tr>\n<tr>\n<td>女（n=200）</td>\n<td>21</td>\n<td>974</td>\n</tr>\n</table>\n<p>(a) 男性年發生率　(b) 女性年發生率　(c) 合計</p>", "a": "<p>(a) <span class=\"tex\">\\(9/478≈\\)</span> <b>0.0188／人年</b><br>(b) <span class=\"tex\">\\(21/974≈\\)</span> <b>0.0216／人年</b><br>(c) <span class=\"tex\">\\(30/1452≈\\)</span> <b>0.0207／人年</b>（合計要「分子加分子、分母加分母」，不能把兩個率平均）</p>", "label": "👉 答案", "keys": [{"v": 0.0188, "pct": false, "label": "0.0188"}, {"v": 0.0216, "pct": false, "label": "0.0216"}, {"v": 0.0207, "pct": false, "label": "0.0207"}], "hasImg": false}, {"id": "3-16", "title": "3-16　HW3 Q13：降血壓新藥 RCT，各 50 人；12 週脫離 HTN：安慰劑 6、新藥 14", "q": "<p>(a) 試驗開始盛行率　(b) 試驗結束盛行率　(c) 兩組脫離 HTN 比例的 RR</p>", "a": "<p>(a) 全員因 HTN 被招募：<b>100%</b><br>(b) 仍有 HTN <span class=\"tex\">\\(=44+36=80\\)</span>：<span class=\"tex\">\\(80/100=\\)</span> <b>80%</b><br>(c) <span class=\"tex\">\\((14/50)/(6/50)=\\)</span> <b>2.33</b></p>", "label": "👉 答案", "keys": [{"v": 100.0, "pct": true, "label": "100%"}, {"v": 80.0, "pct": true, "label": "80%"}, {"v": 2.33, "pct": false, "label": "2.33"}], "hasImg": false}]}, {"key": "CH04", "title": "Chapter 4　描述統計（HW4 20 題＋講義練習）", "notes": [{"title": "", "html": ""}, {"title": "公式小抄", "html": "<ul>\n<li>樣本標準差 <span class=\"tex\">\\(s=\\sqrt{\\Sigma(x-\\bar x)^2/(n-1)}\\)</span>（除以 n−1）</li>\n<li>四分位數（本課算法）：<b>Q1＝下半部中位數、Q3＝上半部中位數</b>；n 為奇數時中位數本身不算進上下半</li>\n<li><span class=\"tex\">\\(IQR=Q3-Q1\\)</span>；Tukey 柵欄：<span class=\"tex\">\\(Q1-1.5×IQR\\)</span>、<span class=\"tex\">\\(Q3+1.5×IQR\\)</span></li>\n<li>對稱無離群值 → <b>平均數＋SD</b>；偏態或有離群值 → <b>中位數＋IQR</b>（成對使用）</li>\n</ul>"}], "qs": [{"id": "4-1", "title": "4-1　Quick Challenge：哪種圖？（講義 P25）", "q": "<p>血型 A/B/AB/O、吸菸狀態 Never/Former/Current、血壓分級 Normal→Pre-HTN→Stage I→Stage II、BMI 分級 Underweight→Obese，各該怎麼展示？</p>", "a": "<p>血型：<b>類別</b>變項 → 長條圖，順序可任意排。吸菸狀態：課本視為類別（也可視為有序）→ 長條圖。血壓分級、BMI 分級：<b>次序</b>變項 → 保留順序的長條圖（ordered display），可加累積百分比。直方圖只給連續資料分箱用（柱子相接）。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "4-2", "title": "4-2　Decision Challenge（講義 P41、P49）", "q": "<p>連續變項有明顯高端離群值，報 Mean±SD 還是 Median (IQR)？另：Case A 大致對稱無離群值；Case B 強烈右偏、多個高端離群值；Case C 要視覺比較兩組。</p>", "a": "<p>有高端離群值 → <b>Median (IQR)</b>。Case A → <b>Mean＋SD</b>；Case B → <b>Median＋IQR</b>；Case C → <b>並排盒鬚圖</b>。口訣：變項型態 → 分布 → 合適摘要。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "4-3", "title": "4-3　講義範例：離群值拉動平均（P31）與四分位數（P38）", "q": "<p>(a) 62, 64, 67, 68, 70, 72, 75, 77, 81, 140 的平均與中位數？(b) 62, 64, 67, 68, 70, 72, 75, 77, 81, 85 的 Q1、中位數、Q3、IQR？</p>", "a": "<p>(a) 平均 <b>77.6</b>、中位數 <b>71</b>——140 把平均拉高，中位數不受影響。<br>(b) Q1＝<b>67</b>、中位數＝(70+72)/2＝<b>71</b>、Q3＝<b>77</b>、IQR＝<b>10</b></p>", "label": "👉 答案", "keys": [{"v": 77.6, "pct": false, "label": "77.6"}, {"v": 71.0, "pct": false, "label": "71"}, {"v": 67.0, "pct": false, "label": "67"}, {"v": 71.0, "pct": false, "label": "71"}, {"v": 77.0, "pct": false, "label": "77"}, {"v": 10.0, "pct": false, "label": "10"}], "hasImg": false}, {"id": "4-4", "title": "4-4　HW4 Q1–2：2–6 歲兒童總膽固醇 185, 225, 240, 196, 175, 180, 194, 147, 223", "q": "<p>(a) 平均 (b) SD (c) 中位數 (d) Q1、Q3 (e) 平均或中位數較能代表典型值？(f) SD 或 IQR？Q2：畫盒鬚圖。</p>", "a": "<p>排序：147, 175, 180, 185, 194, 196, 223, 225, 240<br>(a) <span class=\"tex\">\\(1765/9=\\)</span> <b>196.11</b>　(b) <b>29.00</b>　(c) <b>194</b>　(d) Q1＝<b>177.5</b>、Q3＝<b>224</b>（IQR＝46.5）<br>(e)(f) 柵欄 [107.75, 293.75] 內無離群值、平均≈中位數 → <b>平均數＋SD</b><br>Q2 盒鬚圖：Min 147、Q1 177.5、Median 194、Q3 224、Max 240，無離群點。</p>", "label": "👉 答案", "keys": [{"v": 196.11, "pct": false, "label": "196.11"}, {"v": 29.0, "pct": false, "label": "29.00"}, {"v": 194.0, "pct": false, "label": "194"}, {"v": 177.5, "pct": false, "label": "177.5"}, {"v": 224.0, "pct": false, "label": "224"}], "hasImg": false}, {"id": "4-5", "title": "4-5　HW4 Q3：10–15 歲男女總膽固醇盒鬚圖", "q": "<p><img class=\"fig\" src=\"img/fig1.png\" alt=\"盒鬚圖 1\"></p>\n<p>(a) 男孩中位數？(b) 男孩有離群值嗎？(c) 男孩低於 205 的比例？(d) 女孩低於 205 的比例？</p>", "a": "<p>(a) 約 <b>205</b>　(b) 無單獨標示點 → <b>無離群值</b>　(c) 205＝男孩中位數 → <b>約 50%</b>　(d) 205＝女孩 Q3 → <b>約 75%</b></p>", "label": "👉 答案（讀圖估計）", "keys": [{"v": 205.0, "pct": false, "label": "205"}, {"v": 50.0, "pct": true, "label": "50%"}, {"v": 75.0, "pct": true, "label": "75%"}], "hasImg": true}, {"id": "4-6", "title": "4-6　HW4 Q4：研究生每日咖啡杯數 3, 4, 6, 8, 2, 1, 0, 2", "q": "<p>(a) 平均 (b) SD (c) 中位數 (d) Q1、Q3 (e)(f) 用哪組摘要？</p>", "a": "<p>(a) <b>3.25</b>　(b) <b>2.66</b>　(c) (2+3)/2＝<b>2.5</b>　(d) Q1＝<b>1.5</b>、Q3＝<b>5</b><br>(e)(f) 平均 &gt; 中位數，右偏 → <b>中位數＋IQR（3.5）</b>（8 杯未超過上柵欄 10.25，不算正式離群值，但分布偏斜）</p>", "label": "👉 答案", "keys": [{"v": 3.25, "pct": false, "label": "3.25"}, {"v": 2.66, "pct": false, "label": "2.66"}, {"v": 2.5, "pct": false, "label": "2.5"}, {"v": 1.5, "pct": false, "label": "1.5"}, {"v": 5.0, "pct": false, "label": "5"}, {"v": 3.5, "pct": false, "label": "3.5"}], "hasImg": false}, {"id": "4-7", "title": "4-7　HW4 Q5–7：收縮壓 120, 112, 138, 145, 135, 150, 145, 163, 148, 128, 143, 156, 160, 142, 150", "q": "<p>Q5：(a) 平均 (b) 中位數 (c) SD (d) 全距 (e) 有離群值嗎？Q6：做次數分布表。Q7：畫相對次數直方圖。</p>", "a": "<p>Q5：(a) <b>142.33</b>　(b) <b>145</b>　(c) <b>14.11</b>　(d) 163−112＝<b>51</b><br>(e) Q1＝135、Q3＝150、IQR＝15，下柵欄＝112.5 → <b>112 略低於下柵欄，為潛在離群值</b><br>Q6（10 mmHg 一組）：110–119：1（6.7%）、120–129：2（13.3%）、130–139：2（13.3%）、140–149：5（33.3%）、150–159：3（20.0%）、160–169：2（13.3%）<br>Q7：單峰、峰值在 140–149，柱子要<b>相接</b>（直方圖）。</p>", "label": "👉 答案", "keys": [{"v": 142.33, "pct": false, "label": "142.33"}, {"v": 145.0, "pct": false, "label": "145"}, {"v": 14.11, "pct": false, "label": "14.11"}, {"v": 51.0, "pct": false, "label": "51"}, {"v": 112.0, "pct": false, "label": "112"}], "hasImg": false}, {"id": "4-8", "title": "4-8　HW4 Q8：母親孕期增重分組的出生體重盒鬚圖", "q": "<p><img class=\"fig\" src=\"img/fig2.png\" alt=\"盒鬚圖 2\"></p>\n<p>(a) 增重 50–74 磅組中位數？(b) 75 磅以上組 IQR？(c) 未滿 50 磅組有離群值嗎？(d) 未滿 50 磅組最佳摘要？</p>", "a": "<p>(a) 約 <b>3,125 g</b>　(b) 3,875−3,125＝<b>約 750 g</b>　(c) 無單獨點 → <b>無</b>　(d) 箱子略不對稱 → 保守用<b>中位數＋IQR</b></p>", "label": "👉 答案（讀圖估計）", "keys": [{"v": 3125.0, "pct": false, "label": "3,125"}, {"v": 750.0, "pct": false, "label": "750"}], "hasImg": true}, {"id": "4-9", "title": "4-9　HW4 Q9–11：嬰兒身高 28, 30, 41, 48, 29, 48, 62, 49, 51, 39", "q": "<p>Q9：(a)–(f) 同 Q1。Q10：依 &lt;35、35–44、45–54、≥55 做次數表。Q11：畫直方圖。</p>", "a": "<p>Q9：(a) <b>42.5</b>　(b) <b>11.15</b>　(c) (41+48)/2＝<b>44.5</b>　(d) Q1＝<b>30</b>、Q3＝<b>49</b><br>(e)(f) 柵欄 [1.5, 77.5] 無離群值，但平均 &lt; 中位數（輕微左偏）→ 保守用<b>中位數＋IQR</b>（判斷題，兩者皆可說明理由）<br>Q10：&lt;35：3（30%）、35–44：2（20%）、45–54：4（40%）、≥55：1（10%）<br>Q11：峰值在 45–54。</p>", "label": "👉 答案", "keys": [{"v": 42.5, "pct": false, "label": "42.5"}, {"v": 11.15, "pct": false, "label": "11.15"}, {"v": 44.5, "pct": false, "label": "44.5"}, {"v": 30.0, "pct": false, "label": "30"}, {"v": 49.0, "pct": false, "label": "49"}], "hasImg": false}, {"id": "4-10", "title": "4-10　HW4 Q12：膝關節術後活動度增加 % ：24, 32, 50, 62, 21, 45, 80, 24, 30, 10", "q": "<p>(a) 平均 (b) SD (c) 中位數 (d) Q1、Q3</p>", "a": "<p>(a) <b>37.8%</b>　(b) <b>21.34</b>　(c) (30+32)/2＝<b>31%</b>　(d) Q1＝<b>24</b>、Q3＝<b>50</b></p>", "label": "👉 答案", "keys": [{"v": 37.8, "pct": true, "label": "37.8%"}, {"v": 21.34, "pct": false, "label": "21.34"}, {"v": 31.0, "pct": true, "label": "31%"}, {"v": 24.0, "pct": false, "label": "24"}, {"v": 50.0, "pct": false, "label": "50"}], "hasImg": false}, {"id": "4-11", "title": "4-11　HW4 Q13：健康女性 HDL 60, 58, 52, 70, 54, 72, 80, 38", "q": "<p>(a) 平均 (b) SD (c) 中位數</p>", "a": "<p>(a) <b>60.5</b>　(b) <span class=\"tex\">\\(\\sqrt{1230/7}=\\)</span> <b>13.26</b>　(c) (58+60)/2＝<b>59</b></p>", "label": "👉 答案", "keys": [{"v": 60.5, "pct": false, "label": "60.5"}, {"v": 13.26, "pct": false, "label": "13.26"}, {"v": 59.0, "pct": false, "label": "59"}], "hasImg": false}, {"id": "4-12", "title": "4-12　HW4 Q14：癌症試驗基準點生活品質量表——畫圖", "q": "", "a": "<p>⚠️ 原作業檔<b>沒有附資料表</b>，無法作答。觀念：生活品質等級（如 Poor→Excellent）是<b>次序變項</b> → 用保留順序的長條圖（相對次數），可加累積百分比。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "4-13", "title": "4-13　HW4 Q15：三酸甘油酯 n=200，mean=203, s=64, Min=38, Q1=59, Median=180, Q3=243, Max=394，有離群值嗎？", "q": "", "a": "<p>IQR＝184；柵欄 [59−276, 243+276]＝[<b>−217, 519</b>]，Min 與 Max 都在內 → <b>依 Tukey 規則無離群值</b>。但平均 &gt; 中位數，分布右偏——「偏態」和「有離群值」是兩回事。</p>", "label": "👉 答案", "keys": [{"v": 217.0, "pct": false, "label": "217,"}, {"v": 519.0, "pct": false, "label": "519"}], "hasImg": false}, {"id": "4-14", "title": "4-14　HW4 Q16：失智症研究參與者年齡（Figure 4-27）", "q": "<p><img class=\"fig\" src=\"img/fig3.png\" alt=\"盒鬚圖 3\"></p>\n<p>找出中位數、Q1、Q3。</p>", "a": "<p>Q1 ≈ <b>79</b>、中位數 ≈ <b>87</b>、Q3 ≈ <b>93</b> 歲</p>", "label": "👉 答案（讀圖估計）", "keys": [{"v": 79.0, "pct": false, "label": "79"}, {"v": 87.0, "pct": false, "label": "87"}, {"v": 93.0, "pct": false, "label": "93"}], "hasImg": true}, {"id": "4-15", "title": "4-15　HW4 Q17：新藥 vs. 安慰劑 12 週 HDL（Figure 4-28）", "q": "<p><img class=\"fig\" src=\"img/fig4.png\" alt=\"盒鬚圖 4\"></p>\n<p>(a) 安慰劑組第 25 百分位？(b) 新藥組中位數？(c) 新藥組有離群值嗎？</p>", "a": "<p>(a) Q1 ≈ <b>35</b>　(b) ≈ <b>41.5</b>　(c) 無單獨點 → <b>無</b></p>", "label": "👉 答案（讀圖估計）", "keys": [{"v": 35.0, "pct": false, "label": "35"}, {"v": 41.5, "pct": false, "label": "41.5"}], "hasImg": true}, {"id": "4-16", "title": "4-16　HW4 Q18：同意參與孕婦的妊娠週數 11, 14, 21, 22, 9, 10, 13, 18", "q": "<p>(a) 平均 (b) SD (c) 中位數 (d) 第一孕期（≤13 週）比例</p>", "a": "<p>(a) <b>14.75</b>　(b) <b>5.01</b>　(c) (13+14)/2＝<b>13.5</b>　(d) 9, 10, 11, 13 共 4 人 → <b>50%</b></p>", "label": "👉 答案", "keys": [{"v": 14.75, "pct": false, "label": "14.75"}, {"v": 5.01, "pct": false, "label": "5.01"}, {"v": 13.5, "pct": false, "label": "13.5"}, {"v": 50.0, "pct": true, "label": "50%"}], "hasImg": false}, {"id": "4-17", "title": "4-17　HW4 Q19：樣本有離群值時，何者「必定」成立？(1) Mean &gt; Median (2) SD 比預期小 (3) Mean &lt; Median (4) SD 比預期大", "q": "", "a": "<p><b>(4)</b>。離群值不論在高端或低端都會放大離均差平方和；平均往哪偏要看離群值方向，(1)(3) 不一定。</p>", "label": "👉 答案", "keys": [{"v": 4.0, "pct": false, "label": "4"}], "hasImg": false}, {"id": "4-18", "title": "4-18　HW4 Q20：白血球計數 7, 35, 5, 9, 8, 3, 10, 12, 8", "q": "<p>(a) 有離群值嗎？(b) 適當摘要？</p>", "a": "<p>(a) 排序 3, 5, 7, 8, 8, 9, 10, 12, 35；Q1＝6、Q3＝11、IQR＝5，上柵欄＝18.5 → <b>35 是離群值</b><br>(b) <b>中位數 8＋IQR 5</b>（平均 10.78 被 35 拉高，不適合）</p>", "label": "👉 答案", "keys": [{"v": 35.0, "pct": false, "label": "35"}, {"v": 8.0, "pct": false, "label": "8"}, {"v": 5.0, "pct": false, "label": "5"}], "hasImg": false}]}, {"key": "CH05A", "title": "Chapter 5A　機率：抽樣、條件機率、篩檢、貝氏、二項（講義練習）", "notes": [{"title": "", "html": ""}], "qs": [{"id": "5A-1", "title": "5A-1　抽樣方法判斷（講義 P6–9）", "q": "<p>(a) 先分男女，再在各組內隨機抽 70 男、30 女。(b) 招募門診病人，各年齡層名額滿就停。(c) 名冊 1000 人要抽 100 人，隨機起點後每 10 人抽 1。(d) 抽當下在候診的病人。</p>", "a": "<p>(a) <b>分層抽樣</b>（機率抽樣）　(b) <b>配額抽樣</b>（非機率：組內不隨機）　(c) <b>系統抽樣</b>，<span class=\"tex\">\\(k=N/n=10\\)</span>（陷阱：名冊有週期性會偏誤）　(d) <b>便利抽樣</b><br>判準：「每個人是不是透過已知機率的隨機機制被選進來？」</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "5A-2", "title": "5A-2　範例 5.1：5–10 歲兒童 N=5290（男 2560、7 歲 913、10 歲男孩 418、≥8 歲 846+881+918；女孩 2730、9 歲女孩 461）", "q": "<p>(a) P(男孩)　(b) P(10 歲男孩)　(c) P(≥8 歲)　(d) P(女孩且 9 歲)　(e) P(9 歲｜女孩)</p>", "a": "<p>(a) 2560/5290＝<b>0.484</b>　(b) 418/5290＝<b>0.079</b>　(c) 2645/5290＝<b>0.500</b>　(d) 461/5290＝<b>0.087</b>　(e) 461/2730＝<b>0.169</b><br>(d) vs. (e)：同一個分子 461，分母不同、答案不同——<b>條件一變，分母就變</b>。</p>", "label": "👉 答案", "keys": [{"v": 0.484, "pct": false, "label": "0.484"}, {"v": 0.079, "pct": false, "label": "0.079"}, {"v": 0.5, "pct": false, "label": "0.500"}, {"v": 0.087, "pct": false, "label": "0.087"}, {"v": 0.169, "pct": false, "label": "0.169"}], "hasImg": false}, {"id": "5A-3", "title": "5A-3　範例 5.3：唐氏症篩檢 N=4810（TP 9、FP 351、FN 1、TN 4449）", "q": "<p>求敏感度、特異度、偽陰性率、偽陽性率、PPV、NPV，並解釋為何 PPV 這麼低。</p>", "a": "<p>敏感度 9/10＝<b>90.0%</b>；特異度 4449/4800＝<b>92.7%</b>；偽陰性率 <b>10.0%</b>；偽陽性率 351/4800＝<b>7.3%</b><br>PPV＝9/360＝<b>2.5%</b>；NPV＝4449/4450＝<b>99.9%</b><br>PPV 低是因為<b>盛行率很低</b>（10/4810≈0.2%）——龐大的無病人數乘上 7.3% 偽陽性率，偽陽性遠多於真陽性。⚠️ 預測值不能從病例對照研究直接估計。</p>", "label": "👉 答案", "keys": [{"v": 90.0, "pct": true, "label": "90.0%"}, {"v": 92.7, "pct": true, "label": "92.7%"}, {"v": 10.0, "pct": true, "label": "10.0%"}, {"v": 7.3, "pct": true, "label": "7.3%"}, {"v": 2.5, "pct": true, "label": "2.5%"}, {"v": 99.9, "pct": true, "label": "99.9%"}], "hasImg": false}, {"id": "5A-4", "title": "5A-4　獨立性判斷（範例 5.8）：家族史與 CVD", "q": "<p><span class=\"tex\">\\(P(CVD|有家族史)=491/859\\)</span>、<span class=\"tex\">\\(P(CVD)=643/6732\\)</span>，獨立嗎？</p>", "a": "<p>57.2% vs. 9.6%，條件改變了機率 → <b>不獨立</b>。驗證 <span class=\"tex\">\\(P(A|B)=P(A)\\)</span> 或 <span class=\"tex\">\\(P(B|A)=P(B)\\)</span> 任一方向即可。</p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "5A-5", "title": "5A-5　Try It：貝氏定理——吸菸與性別（講義 P32）", "q": "<p><span class=\"tex\">\\(P(男)=0.51\\)</span>、<span class=\"tex\">\\(P(女)=0.49\\)</span>、<span class=\"tex\">\\(P(吸菸|男)=0.095\\)</span>、<span class=\"tex\">\\(P(吸菸|女)=0.017\\)</span>，求 <span class=\"tex\">\\(P(男|吸菸)\\)</span>。先猜方向再算。</p>", "a": "<p><span class=\"tex\">\\(P(吸菸)=0.095×0.51+0.017×0.49=0.05678\\)</span><br><span class=\"tex\">\\(P(男|吸菸)=0.04845/0.05678≈\\)</span> <b>0.853</b>（從 51% 升到 85.3%，因為男性吸菸率高很多）</p>", "label": "👉 答案", "keys": [{"v": 0.853, "pct": false, "label": "0.853"}], "hasImg": false}, {"id": "5A-6", "title": "5A-6　罕見疾病篩檢（講義 P33–35）", "q": "<p><span class=\"tex\">\\(P(Disease)=0.002\\)</span>、<span class=\"tex\">\\(P(Test+|Disease)=0.85\\)</span>、<span class=\"tex\">\\(P(Test+)=0.08\\)</span>，求 <span class=\"tex\">\\(P(Disease|Test+)\\)</span>。</p>", "a": "<p><span class=\"tex\">\\((0.85×0.002)/0.08=\\)</span> <b>0.021</b>。相對漲了約 10 倍，但絕對機率仍只有 2.1%——呼應「盛行率低時陽性結果意義有限」。</p>", "label": "👉 答案", "keys": [{"v": 0.021, "pct": false, "label": "0.021"}], "hasImg": false}, {"id": "5A-7", "title": "5A-7　二項分布（範例 5.9、P40–42）", "q": "<p>(a) 10 位病人、反應率 0.80，恰好 7 人有反應？(b) n=5、p=0.70：恰好 3 次、全部 5 次、至少 3 次？(c) n=10、p=0.80 的期望值與 SD？</p>", "a": "<p>(a) <span class=\"tex\">\\(\\binom{10}{7}(0.8)^7(0.2)^3=120×0.2097×0.008=\\)</span> <b>0.2013</b><br>(b) <span class=\"tex\">\\(P(3)=10×0.343×0.09=\\)</span> <b>0.3087</b>；<span class=\"tex\">\\(P(5)=0.7^5=\\)</span> <b>0.1681</b>；<span class=\"tex\">\\(P(\\ge3)=0.3087+0.3601+0.1681=\\)</span> <b>0.8369</b><br>(c) <span class=\"tex\">\\(\\mu=np=\\)</span> <b>8</b>；<span class=\"tex\">\\(\\sigma=\\sqrt{10×0.8×0.2}≈\\)</span> <b>1.26</b><br>二項三條件：兩種結果、p 固定、各次獨立。</p>", "label": "👉 答案", "keys": [{"v": 0.2013, "pct": false, "label": "0.2013"}, {"v": 0.3087, "pct": false, "label": "0.3087"}, {"v": 0.1681, "pct": false, "label": "0.1681"}, {"v": 0.8369, "pct": false, "label": "0.8369"}, {"v": 8.0, "pct": false, "label": "8"}, {"v": 1.26, "pct": false, "label": "1.26"}], "hasImg": false}, {"id": "5A-8", "title": "5A-8　Decision Challenge（講義 P45）：各句該用哪個工具？", "q": "<ol>\n<li>陽性結果中真正有病的比例？2. 家族史會改變 CVD 機率嗎？3. 10 人中恰好 7 人有反應？4. 陽性結果如何更新罕見病機率？5. 檢測能抓出多少真病人？6. 怎麼選代表性樣本？</li>\n</ol>", "a": "<p>1 <b>PPV</b>　2 <b>Independence</b>　3 <b>Binomial</b>　4 <b>Bayes</b>　5 <b>Sensitivity</b>　6 <b>Sampling</b></p>", "label": "👉 答案", "keys": [], "hasImg": false}]}, {"key": "CH05B", "title": "Chapter 5B　常態分布、百分位、抽樣分布與 CLT（講義練習）", "notes": [{"title": "", "html": ""}], "qs": [{"id": "5B-1", "title": "5B-1　範例 5.11：60 歲男性 BMI（μ=29, σ=6）", "q": "<p>(a) P(X&lt;29)　(b) P(X&lt;35)（用 68 法則）　(c) P(X&lt;30)　(d) P(X&gt;35)　(e) P(30&lt;X&lt;35)</p>", "a": "<p>(a) <b>0.50</b>　(b) 0.50＋0.34≈<b>0.84</b>　(c) Z＝0.17 → <b>0.5675</b>　(d) Z＝1.00 → 1−0.8413＝<b>0.1587</b>　(e) 0.8413−0.5675＝<b>0.2738</b></p>", "label": "👉 答案", "keys": [{"v": 0.5, "pct": false, "label": "0.50"}, {"v": 0.84, "pct": false, "label": "0.84"}, {"v": 0.5675, "pct": false, "label": "0.5675"}, {"v": 0.1587, "pct": false, "label": "0.1587"}, {"v": 0.2738, "pct": false, "label": "0.2738"}], "hasImg": false}, {"id": "5B-2", "title": "5B-2　範例 5.12：BMI 第 90 百分位", "q": "<p>男性 μ=29, σ=6；女性 μ=28, σ=7。</p>", "a": "<p>男：<span class=\"tex\">\\(29+1.282×6=\\)</span> <b>36.69</b>；女：<span class=\"tex\">\\(28+1.282×7=\\)</span> <b>36.97</b>。同一百分位用同一個 Z（1.282）。</p>", "label": "👉 答案", "keys": [{"v": 36.69, "pct": false, "label": "36.69"}, {"v": 36.97, "pct": false, "label": "36.97"}], "hasImg": false}, {"id": "5B-3", "title": "5B-3　範例 5.14：母體 25, 50, 80, 85, 90, 100（μ=71.7, σ=25.9），抽 n=4 不放回", "q": "<p>共有幾種樣本？抽樣分布的平均與 SD 跟母體比較？</p>", "a": "<p><span class=\"tex\">\\(\\binom64=\\)</span> <b>15</b> 種，每種機率 1/15。X̄ 的平均＝<b>71.7</b>（＝μ，不偏）；X̄ 的 SD＝<b>8.5</b>（遠小於 σ=25.9）。</p>", "label": "👉 答案", "keys": [{"v": 15.0, "pct": false, "label": "15"}, {"v": 71.7, "pct": false, "label": "71.7"}, {"v": 8.5, "pct": false, "label": "8.5"}], "hasImg": false}, {"id": "5B-4", "title": "5B-4　範例 5.18：40 位病人平均 HDL &gt; 60 的機率（μ=54, σ=17）", "q": "", "a": "<p>n=40&gt;30 → CLT。<span class=\"tex\">\\(SE=17/\\sqrt{40}=2.69\\)</span>；<span class=\"tex\">\\(Z=6/2.69=2.22\\)</span>；<span class=\"tex\">\\(P=1-0.9868=\\)</span> <b>0.0132</b></p>", "label": "👉 答案", "keys": [{"v": 0.0132, "pct": false, "label": "0.0132"}], "hasImg": false}, {"id": "5B-5", "title": "5B-5　範例 5.19＋Try It：樣本平均落在 μ 附近的機率", "q": "<p>(a) σ=13、n=100，落在 μ±3 內？(b) σ=12、n=100，落在 μ±2 內？</p>", "a": "<p>(a) SE＝1.3、Z＝±2.31 → 0.9896−0.0104＝<b>0.9792</b><br>(b) SE＝1.2、Z＝±1.67 → 0.9525−0.0475＝<b>0.905</b><br>μ 在標準化時消掉，所以不知道 μ 也能算。</p>", "label": "👉 答案", "keys": [{"v": 0.9792, "pct": false, "label": "0.9792"}, {"v": 0.905, "pct": false, "label": "0.905"}], "hasImg": false}, {"id": "5B-6", "title": "5B-6　Decision Challenge（講義 P41）", "q": "<ol>\n<li>一位男性 BMI&lt;30 的機率 2. BMI 第 90 百分位 3. 樣本平均的變異 4. 40 人平均 HDL&gt;60 5. 為何大樣本 X̄ 近似常態 6. n 變大對精確度影響</li>\n</ol>", "a": "<p>1 <b>Z for X</b>　2 <b>Percentile formula</b>　3 <b>Standard error</b>　4 <b>Z for X̄</b>　5 <b>CLT</b>　6 <b>SE decreases</b></p>", "label": "👉 答案", "keys": [], "hasImg": false}, {"id": "5B-7", "title": "5B-7　「正常範圍」討論題（講義 P2–3）", "q": "<p>為何健康的人也可能落在參考範圍外？</p>", "a": "<p>參考範圍取健康志願者中間約 95%，所以本來就有約 5% 健康人落在範圍外。統計上的「範圍外」≠ 臨床上的「有病」；範圍內也可能給人假性安心，需搭配臨床資訊判讀。</p>", "label": "👉 答案", "keys": [], "hasImg": false}]}, {"key": "HW5", "title": "Chapter 5　HW5（Homework CH05-Q）20 題", "notes": [{"title": "", "html": "<blockquote>完整解題過程見 <a href=\"https://app.notion.com/p/4047440a46108044b99deddb44cb1aed\" target=\"_blank\">Notion 頁面</a>。以下為題目＋答案摘要。</blockquote>"}], "qs": [{"id": "H5-1", "title": "H5-1　兒童高血脂盛行率 30%，分析 12 人", "q": "<p>(a) 至少 3 人 (b) 恰好 3 人 (c) 期望人數</p>", "a": "<p>(a) <span class=\"tex\">\\(1-[P(0)+P(1)+P(2)]=\\)</span> <b>0.7472</b>　(b) <b>0.2397</b>　(c) <b>3.6</b></p>", "label": "👉 答案", "keys": [{"v": 0.7472, "pct": false, "label": "0.7472"}, {"v": 0.2397, "pct": false, "label": "0.2397"}, {"v": 3.6, "pct": false, "label": "3.6"}], "hasImg": false}, {"id": "H5-2", "title": "H5-2　父母／子女高血脂表（雙親 13/45、一方 34/42、皆無 83/6；格式：子女無／有）", "q": "<p>(a) 父母一方或雙方高血脂 (b) 子女與雙親皆高血脂 (c) 父母皆無時子女高血脂 (d) 雙親皆有時子女高血脂</p>", "a": "<p>N＝223。(a) 134/223＝<b>0.601</b>　(b) 45/223＝<b>0.202</b>　(c) 6/89＝<b>0.067</b>　(d) 45/58＝<b>0.776</b></p>", "label": "👉 答案", "keys": [{"v": 0.601, "pct": false, "label": "0.601"}, {"v": 0.202, "pct": false, "label": "0.202"}, {"v": 0.067, "pct": false, "label": "0.067"}, {"v": 0.776, "pct": false, "label": "0.776"}], "hasImg": false}, {"id": "H5-3", "title": "H5-3　10–15 歲總膽固醇 μ=191, σ=22.4", "q": "<p>(a) 180–190 之間 (b) &gt;200 (c) 20 人平均 &gt;200</p>", "a": "<p>(a) Z −0.49 ~ −0.04 → <b>0.1719</b>　(b) Z＝0.40 → <b>0.3446</b>　(c) SE＝5.01、Z＝1.80 → <b>0.0359</b></p>", "label": "👉 答案", "keys": [{"v": 0.1719, "pct": \n<td><span class=\"tex\">\\(TP/(TP+FN)\\)</span>；<span class=\"tex\">\\(TN/(TN+FP)\\)</span></td>\n</tr>\n<tr>\n<td>CH05A</td>\n<td>PPV／NPV</td>\n<td><span class=\"tex\">\\(TP/(TP+FP)\\)</span>；<span class=\"tex\">\\(TN/(TN+FN)\\)</span></td>\n</tr>\n<tr>\n<td>CH05A</td>\n<td>貝氏</td>\n<td>$`P(A|B)=P(B|A)P(A)/P(B)`$</td>\n</tr>\n<tr>\n<td>CH05A</td>\n<td>二項</td>\n<td><span class=\"tex\">\\(\\binom nx p^x(1-p)^{n-x}\\)</span>；<span class=\"tex\">\\(\\mu=np\\)</span>、<span class=\"tex\">\\(\\sigma=\\sqrt{np(1-p)}\\)</span></td>\n</tr>\n<tr>\n<td>CH05B</td>\n<td>標準化</td>\n<td><span class=\"tex\">\\(Z=(X-\\mu)/\\sigma\\)</span></td>\n</tr>\n<tr>\n<td>CH05B</td>\n<td>百分位</td>\n<td><span class=\"tex\">\\(X=\\mu+Z\\sigma\\)</span>（90th：1.282、95th：1.645）</td>\n</tr>\n<tr>\n<td>CH05B</td>\n<td>樣本平均</td>\n<td><span class=\"tex\">\\(Z=(\\bar X-\\mu)/(\\sigma/\\sqrt n)\\)</span></td>\n</tr>\n</table>\n<p><b>最常見的五個失分點</b>：① 累積發生率分母沒扣掉基準點已有病的人 ② 病例對照研究算了 RR ③ 問「平均」卻用 σ 沒用 σ/√n ④ top 5% 用了 Z＝−1.645 或 1.282 ⑤ 二項「more than / fewer than」把邊界值算進去</p>"}], "qs": []}];
const NAMES = {CH01:'CH01 導論',CH02:'CH02 研究設計',CH03:'CH03 頻率與關聯',CH04:'CH04 描述統計',CH05A:'CH05A 機率',CH05B:'CH05B 常態',HW5:'HW5',CHEAT:'📋 小抄'};
const KEY = 'biostat-midterm-v1';
const ALL = DATA.flatMap(c => c.qs.map(q => ({...q, ch: c.key})));

// localStorage 讀寫都包 try/catch：無痕模式或被封鎖時照常運作，只是不記錄
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
let st = load();
st.p = st.p || {};          // 章節模式每題進度：{ans, res:'right'|'wrong'}
st.r = st.r || {};          // 隨機模式獨立計分，不影響章節進度
const B = () => tab === 'RAND' ? st.r : st.p;
// 網址 #CH03 這類 hash 可直接指定分頁
const hashTab = location.hash.slice(1).toUpperCase();
let tab = [...Object.keys(NAMES), 'RAND'].includes(hashTab) ? hashTab : (st.tab || 'CH01');
let randSet = null;          // 隨機模式抽到的題目 id

// 主題切換：記住使用者選擇
function applyTheme(){ if (st.theme) document.documentElement.dataset.theme = st.theme; }
document.getElementById('theme').onclick = () => {
  const dark = st.theme ? st.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  st.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

const uid = q => q.ch + ':' + q.id;
function counts(list, b = st.p){
  let done = 0, ok = 0;
  list.forEach(q => { const r = (b[uid(q)] || {}).res; if (r) done++; if (r === 'right') ok++; });
  return {done, ok, n: list.length};
}

function renderTabs(){
  const keys = DATA.map(c => c.key).filter(k => k !== 'CHEAT');
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  [...keys, 'RAND', 'CHEAT'].forEach(k => {
    const b = document.createElement('button');
    b.className = k === tab ? 'on' : '';
    if (k === 'RAND') b.innerHTML = '🎲 隨機 10 題';
    else if (k === 'CHEAT') b.innerHTML = NAMES.CHEAT;
    else { const c = counts(ALL.filter(q => q.ch === k)); b.innerHTML = NAMES[k] + `<small>${c.ok}/${c.n}</small>`; }
    b.onclick = () => { tab = k; st.tab = k; save(); render(); scrollTo(0, 0); };
    t.appendChild(b);
  });
  const c = counts(ALL);
  document.getElementById('stat').textContent = `已自評 ${c.done}/${c.n}，答對 ${c.ok}`;
}

// 數值比對：答案粗體裡的數字當關鍵值；容許 ±0.005（大數值容許 0.05%），百分比也接受小數寫法
function checkNums(q, text){
  const us = (text.match(/-?\d[\d,]*(?:\.\d+)?/g) || []).map(s => parseFloat(s.replace(/,/g, '')));
  let hit = 0;
  q.keys.forEach(k => {
    const tol = Math.max(0.005, Math.abs(k.v) * 0.0005);
    if (us.some(u => Math.abs(u - k.v) <= tol || (k.pct && Math.abs(u * 100 - k.v) <= tol))) hit++;
  });
  return {hit, n: q.keys.length, ok: hit === q.keys.length};
}

function card(q){
  const p = B()[uid(q)] || {};
  const el = document.createElement('section');
  el.className = 'card ' + (p.res || '');
  const numeric = q.keys.length > 0;
  el.innerHTML = `
    <h2><span class="qid">${NAMES[q.ch].split(' ')[0]} ${q.id}</span>${q.title.replace(q.id, '').trim()}</h2>
    <div class="q">${q.q}</div>
    ${q.hasImg ? `<p class="intro">看不清楚可開 <a href="https://app.notion.com/p/4047440a461081c9884dfa1803150978" target="_blank">Notion 原圖</a>。</p>` : ''}
    <textarea placeholder="${numeric ? '計算題：把各小題答案的數字依序打進來（空白或逗號分隔），再按「比對數值」' : '先寫下你的答案或要點，再看解答自評'}"></textarea>
    <div class="row">
      ${numeric ? '<button class="btn chk">比對數值</button>' : ''}
      <button class="btn pri show">看答案</button>
      <span class="sp" style="flex:1"></span>
      <button class="btn ok ${p.res === 'right' ? 'on' : ''}">✅ 答對</button>
      <button class="btn bad ${p.res === 'wrong' ? 'on' : ''}">❌ 再練</button>
    </div>
    <div class="res"></div>
    <div class="ans" hidden><div class="lab">${q.label}</div>${q.a}</div>`;
  const ta = el.querySelector('textarea');
  ta.value = p.ans || '';
  ta.oninput = () => { B()[uid(q)] = {...(B()[uid(q)] || {}), ans: ta.value}; save(); };
  const ansBox = el.querySelector('.ans');
  el.querySelector('.show').onclick = e => {
    ansBox.hidden = !ansBox.hidden;
    e.target.textContent = ansBox.hidden ? '看答案' : '收起答案';
    if (!ansBox.hidden) typeset(ansBox);
  };
  const chk = el.querySelector('.chk');
  if (chk) chk.onclick = () => {
    const r = checkNums(q, ta.value);
    const box = el.querySelector('.res');
    box.innerHTML = `<div class="check ${r.ok ? 'good' : 'part'}">${r.ok ? '🎯 關鍵數值全部符合！' : `符合 ${r.hit}/${r.n} 個關鍵數值，`}${r.ok ? '' : '看答案找差在哪（答案裡的單位、頁碼等數字也算在內，自評為準）'}</div>`;
  };
  const mark = res => {
    const cur = B()[uid(q)] || {};
    cur.res = cur.res === res ? undefined : res;   // 再按一次可取消
    B()[uid(q)] = cur; save(); render(true);
  };
  el.querySelector('.btn.ok').onclick = () => mark('right');
  el.querySelector('.btn.bad').onclick = () => mark('wrong');
  return el;
}

function notesBlock(notes, title){
  const d = document.createElement('details');
  d.className = 'notes';
  d.innerHTML = `<summary>${title}</summary>` + notes.map(n => `<div class="note">${n.title ? `<h3>${n.title}</h3>` : ''}${n.html}</div>`).join('');
  d.ontoggle = () => typeset(d);
  return d;
}

function pickRandom(onlyWeak){
  let pool = ALL;
  if (onlyWeak) pool = ALL.filter(q => (st.p[uid(q)] || {}).res !== 'right');
  pool = [...pool].sort(() => Math.random() - 0.5);
  randSet = pool.slice(0, 10).map(uid);
}

function render(keepScroll){
  const y = scrollY;
  renderTabs();
  const m = document.getElementById('main');
  m.innerHTML = '';
  if (tab === 'CHEAT') {
    const c = DATA.find(c => c.key === 'CHEAT');
    c.notes.forEach(n => { const s = document.createElement('section'); s.className = 'card note';
      s.innerHTML = (n.title ? `<h2>${n.title}</h2>` : '') + n.html; m.appendChild(s); });
    const s = document.createElement('section'); s.className = 'card';
    s.innerHTML = `<h2>重設</h2><p class="intro">清除所有作答紀錄與自評（只影響這台裝置的瀏覽器）。</p><button class="btn bad on" id="reset">清除全部進度</button>`;
    m.appendChild(s);
    s.querySelector('#reset').onclick = () => { st.p = {}; st.r = {}; save(); render(); };
  } else if (tab === 'RAND') {
    if (!randSet) pickRandom(false);
    const list = ALL.filter(q => randSet.includes(uid(q)));
    const c = counts(list, st.r);
    const head = document.createElement('section'); head.className = 'card';
    head.innerHTML = `<h2>🎲 隨機 10 題</h2><p>本組：已自評 ${c.done}/${c.n}，答對 <b>${c.ok}</b>${c.done === c.n && c.n ? `（${Math.round(c.ok / c.n * 100)} 分）` : ''}</p>
      <div class="row"><button class="btn pri" id="r1">重新抽 10 題</button><button class="btn" id="r2">只抽還沒答對的</button></div>`;
    m.appendChild(head);
    head.querySelector('#r1').onclick = () => { pickRandom(false); clearMarks(); render(); };
    head.querySelector('#r2').onclick = () => { pickRandom(true); clearMarks(); render(); };
    if (!list.length) m.insertAdjacentHTML('beforeend', '<p class="empty">全部都答對了 🎉</p>');
    list.forEach(q => m.appendChild(card(q)));
  } else {
    const c = DATA.find(c => c.key === tab);
    m.insertAdjacentHTML('beforeend', `<p class="intro">${c.title}　·　共 ${c.qs.length} 題　·　題庫原文在 <a href="https://app.notion.com/p/4047440a461081c9884dfa1803150978" target="_blank">Notion</a></p>`);
    if (c.notes.some(n => n.html.trim())) m.appendChild(notesBlock(c.notes.filter(n => n.html.trim()), '📌 本章小抄（點開）'));
    ALL.filter(q => q.ch === tab).forEach(q => m.appendChild(card(q)));
  }
  typeset(m);
  if (keepScroll) scrollTo(0, y);
}

// 隨機新一組時，清空隨機模式的紀錄重新計分（章節進度不受影響）
function clearMarks(){ st.r = {}; save(); }

// KaTeX 數學式排版（CDN 載入失敗時仍顯示原始公式文字）
function typeset(el){
  if (window.renderMathInElement) renderMathInElement(el, {delimiters: [{left: '\\(', right: '\\)', display: false}], throwOnError: false});
}
window.addEventListener('load', () => typeset(document.getElementById('main')));
render();
</script>
